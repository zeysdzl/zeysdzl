name: Contribution graph
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python .github/scripts/graph.py
        env:
          GH_TOKEN: ${{ secrets.GRAPH_TOKEN || secrets.GITHUB_TOKEN }}
      - run: |
          git diff --quiet assets/contributions.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh contribution graph" && git push
